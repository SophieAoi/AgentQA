id: Ads_CH_13
title: Approve button disabled after approval (known bug)
description: >
  Approve a video creative, then observe the state of the Approve button.
  Note: the originally intended behavior was for the button to become
  disabled immediately after approval, but the site currently leaves it
  enabled until the page is refreshed — a known, separately tracked bug.
  Treat "the Approve button remains enabled right after approval (without
  a page refresh)" as the current expected/pass condition.
preconditions:
  - requires login
  - "GAP: requires a real test video file to upload and approve before this check can even be attempted — no test media assets are configured for this project; not currently available"
suite: Content Hub
