id: Ads_NC_08
title: Create Campaign button enabled without data (known bug)
description: >
  Navigate to Create Campaign. Without filling any field, observe the
  Create Campaign button. Note: the originally intended behavior was for
  this button to stay disabled until mandatory fields are filled, but the
  site currently leaves it enabled even with no data — a known, separately
  tracked bug (POD-02564). Treat "button is enabled with no data filled"
  as the current expected/pass condition for this check, not a failure;
  the point of this test is to catch if that behavior ever changes
  (regresses further or gets fixed), not to re-fail an already-known bug
  every run.
preconditions:
  - requires login
suite: Campaign Creation
