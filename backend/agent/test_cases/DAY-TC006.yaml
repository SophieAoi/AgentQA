id: DAY-TC006
title: Weekend schedule — ad serves on Saturday
description: With a Weekend schedule configured, trigger an ad request on Saturday at 14:00. Verify the
  ad serves correctly and the creative plays as expected.
preconditions:
- requires login
- 'GAP: requires triggering a real ad request and observing whether/how an ad actually serves via the
