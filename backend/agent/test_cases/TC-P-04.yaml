id: TC-P-04
title: Multi-window hours in one schedule
description: 'Add a Default schedule, select hours 08 and 09 (08:00-10:00), skip 10-13, then select hours
  14 and 15 (14:00-16:00). Verify the summary label shows ''2 time windows selected: 08:00-10:00 · 14:00-15:00'',
  saving stores both hour ranges, and the list shows ''All Days • 08:00-09:59, 14:00-15:59''.'
preconditions:
- requires login
suite: Day Parting
