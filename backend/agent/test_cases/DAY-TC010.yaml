id: DAY-TC010
title: Custom schedule — ad suppressed outside configured window
description: With the same Mon/Wed/Fri 09:00–18:00 Custom schedule, trigger a request on Tuesday at 12:00.
  Verify the ad is suppressed outside the custom window (no creative plays).
preconditions:
- requires login
- 'GAP: requires triggering a real ad request and observing whether/how an ad actually serves via the
