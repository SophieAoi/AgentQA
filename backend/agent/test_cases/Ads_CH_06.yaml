id: Ads_CH_06
title: Delete folder (known bug)
description: >
  Navigate to Creatives and create a new folder with a unique name
  (include a timestamp so this doesn't collide with previous runs).
  Select that folder, then click Delete. Note: the originally intended
  behavior was for the folder to be deleted successfully, but the site
  currently fails to delete it — a known, separately tracked bug. Treat
  "the folder is not actually deleted / the delete action doesn't
  succeed" as the current expected/pass condition for this check, not a
  failure; the point of this test is to catch if that behavior ever
  changes, not to re-fail an already-known bug every run.
preconditions:
  - requires login
suite: Content Hub
