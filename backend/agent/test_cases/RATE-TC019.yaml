id: RATE-TC019
title: Rate card updated mid-flight
description: With a campaign live at a $5 floor, have an admin raise the floor to $8, then submit a new
  bid at $6. Verify the $6 bid is rejected against the new $8 floor and prior impressions are unaffected.
preconditions:
- requires login
- 'GAP: requires a real DSP/SSP bidding integration (RTB auction mechanics, bid submission, rate sync)
  — this project has no configured demand-side/supply-side ad-tech integration to exercise; not currently
  available'
suite: Player Testing
