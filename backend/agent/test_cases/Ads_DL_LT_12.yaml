id: Ads_DL_LT_12
title: Duplicate Deal Name — should be prevented (known bug)
description: >
  Navigate to Deals and create a new deal with a specific, unique test
  name (include a timestamp so this doesn't collide with previous runs).
  Then attempt to create a second, separate deal using that exact same
  name again. Note: the originally intended behavior was for the system
  to prevent duplicate deal names, but it currently allows them — a known,
  separately tracked bug. Treat "the second deal is created successfully
  despite the duplicate name" as the current expected/pass condition for
  this check, not a failure; the point of this test is to catch if that
  behavior ever changes, not to re-fail an already-known bug every run.
preconditions:
  - requires login
suite: Deal Management
