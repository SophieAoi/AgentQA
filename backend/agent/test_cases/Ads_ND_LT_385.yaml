id: Ads_ND_LT_385
title: Filters apply correctly in DOOH Inventories (known bug)
description: >
  Navigate to DOOH Inventories, apply any filter (e.g. Status or Screen
  Type), and observe the inventory list. Note: the originally intended
  behavior was for the list to update based on the selected filter, but
  the site currently leaves the list unchanged — a known, separately
  tracked bug (POD-02386). Treat "the inventory list does not visibly
  change after applying the filter" as the current expected/pass
  condition for this check, not a failure; the point of this test is to
  catch if that behavior ever changes, not to re-fail an already-known
  bug every run.
preconditions:
  - requires login
suite: Inventory
