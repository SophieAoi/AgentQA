id: Ads_CH_02
title: Upload video without selecting folder (known bug)
description: >
  Navigate to Creatives, without creating or selecting a folder, click
  Upload, and select a video file. Note: the originally intended behavior
  was for the system to require folder selection before upload, but it
  currently allows uploading without one (making the video unfindable
  afterward) — a known, separately tracked bug. Treat "the upload succeeds
  without requiring a folder" as the current expected/pass condition.
preconditions:
  - requires login
  - "GAP: requires a real test video file to upload — no test media assets are configured for this project; not currently available. Source sheet also marks this case Automated: No."
suite: Content Hub
