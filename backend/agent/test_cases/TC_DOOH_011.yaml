id: TC_DOOH_011
title: Delivery report — Direct campaign, single creative
description: >
  Create a Direct campaign, add a single inventory item mapped with a
  device ID, assign a single creative, activate the campaign, and check
  the delivery report after the creative plays. Verify the campaign is
  activated, the line item and inventory are mapped, the creative plays
  on the physical player, and the delivery report reflects an accurate
  play count.
preconditions:
  - requires login
  - "GAP: requires a real physical DOOH player device that actually plays the creative and reports back — this is outside what any browser-driving UI automation tool can cause or verify, regardless of test fixtures; needs real signage hardware/infrastructure integration. Source sheet also marks this case Automated: No."
suite: Delivery Reports
